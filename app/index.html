<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puntal Presupuestos</title>
<meta name="theme-color" content="#161B22">
<meta name="description" content="Presupuestos y mediciones para instaladores. Gratis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Puntal">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: herramienta de trabajo. Editor a la izquierda, resumen fijo a la derecha; en móvil, una columna. El documento es siempre papel blanco. */
:root {
  --bg: #EEF0F2;
  --surface: #FFFFFF;
  --sunk: #E4E7EB;
  --fg: #161B22;
  --muted: #586271;
  --line: #D2D7DD;
  --accent: #F2C200;
  --accent-ink: #161B22;
  --focus: #1F6FEB;
  --danger: #B42318;
  --ok: #1A7F37;
  --info: #1F5FBF;
  --paper: #FFFFFF;
  --paper-ink: #15181C;
  --paper-muted: #5B6470;
  --paper-line: #C9CED4;
  --paper-band: #F1F3F5;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-num: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #171C23; --sunk: #1F252E; --fg: #E6E9ED; --muted: #9AA4B2;
    --line: #2D343E; --accent: #F2C200; --accent-ink: #161B22; --focus: #58A6FF;
    --danger: #F97066; --ok: #4AC26B; --info: #6CA8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #171C23; --sunk: #1F252E; --fg: #E6E9ED; --muted: #9AA4B2;
  --line: #2D343E; --accent: #F2C200; --accent-ink: #161B22; --focus: #58A6FF;
  --danger: #F97066; --ok: #4AC26B; --info: #6CA8FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 15px/1.45 var(--f-ui);
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
.mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Barra superior */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg); }
.bar-in {
  max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
.brand b::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 8px; transform: translateY(-1px); }
.brand span { font-size: 12px; opacity: .7; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  padding: 7px 11px; border-radius: 6px; font-size: 14px; opacity: .75;
}
nav button:hover { opacity: 1; }
nav button.install { border: 1px solid var(--accent); color: var(--accent); opacity: 1; }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); opacity: 1; font-weight: 600; }

/* Elementos comunes */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 8px 14px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.wide { width: 100%; }
.btn.danger, .link.danger { color: var(--danger); }
.link { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--info); font-size: 13px; font-weight: 500; }
.icon { background: none; border: 1px solid transparent; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); flex: none; }
.icon:hover { border-color: var(--line); color: var(--danger); }

.fg { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.f { display: grid; gap: 4px; min-width: 0; }
.f > span { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.f input, .f select, .f textarea, .med input {
  width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px;
}
.f textarea { resize: vertical; min-height: 40px; }
.f input:focus, .f select:focus, .f textarea:focus, .med input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.f.out b { padding: 8px 0; font-size: 15px; }
.num-in { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* Editor */
.ed { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); padding-top: 20px; }
.ed-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
@media (min-width: 960px) {
  .ed { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .ed-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
}
.cap-h { display: flex; align-items: center; gap: 10px; }
.cap-n { background: var(--fg); color: var(--bg); border-radius: 4px; padding: 3px 7px; font-size: 13px; flex: none; }
.cap-name { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 17px; font-weight: 600; padding: 6px 2px; }
.cap-name:focus { outline: none; border-bottom: 2px solid var(--focus); }
.cap-tot { font-size: 15px; white-space: nowrap; }
.part { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; background: var(--surface); min-width: 0; }
.part-top { display: grid; gap: 10px; grid-template-columns: 110px minmax(0, 1fr); }
.part-nums { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); align-items: end; }
@media (max-width: 520px) { .part-top { grid-template-columns: minmax(0, 1fr); } }
.part-acts { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.cap-f { display: flex; flex-wrap: wrap; gap: 8px; }

.tbl-wrap { overflow-x: auto; min-width: 0; }
.med { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
.med th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 4px; font-size: 12px; }
.med td { padding: 3px 4px; }
.med td:first-child { width: 34%; }
.med input { padding: 6px 8px; }
.med .r, .r { text-align: right; }
.med td.par { white-space: nowrap; padding-right: 8px; }

.picker { background: var(--sunk); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.plist { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.pitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.pitem:hover { border-color: var(--focus); }
.pitem .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tot dl { margin: 0; display: grid; gap: 0; }
.tot dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tot dt { color: var(--muted); }
.tot dd { margin: 0; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.tot .grand { border-bottom: 0; padding-top: 12px; }
.tot .grand dt { color: var(--fg); font-weight: 600; }
.tot .grand dd { font-size: 20px; font-weight: 500; }

/* Lista */
.page-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-block: 20px 16px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.card.on { border-color: var(--focus); }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 { font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .acts { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.card .acts .btn { padding: 6px 10px; font-size: 13px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.st-borrador { color: var(--muted); }
.st-enviado { color: var(--info); }
.st-aceptado { color: var(--ok); }
.st-rechazado { color: var(--danger); }
.backup { margin-top: 0; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.tile span { font-size: 12px; color: var(--muted); }
.tile b { font: 500 20px var(--f-num); font-variant-numeric: tabular-nums; }
.tile small { font-size: 11px; color: var(--muted); }
.panel.warn { border-color: var(--accent); }
.pend { display: grid; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.pend .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; }
.seg { display: grid; gap: 8px; }
details.panel > summary { cursor: pointer; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
.part.opc { border-left-color: var(--muted); border-style: dashed; }
.chk.sm { font-size: 13px; color: var(--muted); gap: 6px; }
.ac-list { display: grid; gap: 6px; }
.ac-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { background: var(--surface); border-radius: 10px; padding: 16px; width: min(560px, 100%); display: grid; gap: 12px; }
.sigpad { width: 100%; height: 220px; background: #fff; border: 1px dashed var(--muted); border-radius: 8px; touch-action: none; display: block; }
.d-pagos table { width: 100%; border-collapse: collapse; }
.d-pagos td { padding: 6px 0; border-bottom: 1px solid var(--paper-line); }
.d-pagos td.r { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-opc { color: var(--paper-muted); font-weight: 400; font-family: var(--f-ui); font-size: 12px; }
.saved { font-size: 12px; opacity: .6; white-space: nowrap; }
.saved.err { color: #FF8A80; opacity: 1; font-weight: 600; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.tag.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tags { font-size: 12px; color: var(--muted); }
details.popt > summary { cursor: pointer; color: var(--focus); font-size: 13px; padding: 2px 0; }
.popt-in { display: grid; gap: 10px; padding-top: 10px; grid-template-columns: minmax(0, 1fr); }
.fotos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.foto { display: grid; gap: 6px; min-width: 0; }
.foto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--sunk); }
.foto input { font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); color: var(--fg); min-width: 0; }
.d-fotos { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.d-fotos figure { margin: 0; break-inside: avoid; }
.d-fotos img { width: 100%; max-height: 300px; object-fit: contain; border: 1px solid var(--paper-line); background: #fff; }
.d-fotos figcaption { font-size: 11.5px; color: var(--paper-muted); padding-top: 4px; }
.d-det { display: block; font-size: 11.5px; color: var(--paper-muted); margin-top: 4px; }
.d-alt { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border: 1px solid var(--paper-acc); color: var(--paper-acc); border-radius: 3px; }
.d-comp { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.d-op { border: 1px solid var(--paper-line); border-top: 4px solid var(--paper-acc); border-radius: 4px; padding: 12px; display: grid; gap: 8px; align-content: start; break-inside: avoid; }
.d-op table { width: 100%; border-collapse: collapse; }
.d-op td { padding: 5px 0; border-bottom: 1px solid var(--paper-line); vertical-align: top; }
.d-op td.r { text-align: right; font-family: var(--f-num); white-space: nowrap; padding-left: 8px; }
.d-op tr.grand td { font-weight: 700; border-bottom: 0; font-size: 14px; }
.d-elige { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.drawpad { display: block; margin: 0 auto; max-width: 100%; max-height: 58vh; width: auto; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
.btn.sel { outline: 2px solid var(--focus); }
.mic { font: inherit; font-size: 12px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.mic.on { background: var(--danger); color: #fff; border-color: var(--danger); }
.bref { grid-column: 1 / -1; margin: -2px 0 0; font-size: 12px; }
.meter { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.hi i { background: var(--danger); }
.f.inl { min-width: 170px; }
.calc .res { display: grid; gap: 4px; background: var(--sunk); border-radius: 6px; padding: 12px; }
.calc .res b { font: 500 22px var(--f-num); }
.upd { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); width: max-content; max-width: calc(100% - 32px); }
body.obra .f input, body.obra .f select, body.obra .f textarea, body.obra .med input { font-size: 18px; padding: 12px; }
body.obra .btn, body.obra .link { min-height: 44px; }
body.obra .ed-side, body.obra .sec-imp { display: none; }
@media (min-width: 700px) and (max-width: 959px) { .part-nums { grid-template-columns: repeat(4, minmax(0, 1fr)); } .fg.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.paper { --paper-acc: var(--paper-ink); }
.paper .d-h { border-bottom-color: var(--paper-acc); }
.paper .d-cap h3 span { color: var(--paper-acc); }
.paper.dz-moderno .d-h { border-bottom-width: 6px; }
.paper.dz-moderno .d-cap h3 { background: var(--paper-acc); color: #fff; padding: 6px 10px; border-radius: 3px; }
.paper.dz-moderno .d-cap h3 span, .paper.dz-moderno .d-cap h3 .d-opc { color: #fff; }
.paper.dz-moderno .d-t th { border-bottom-color: var(--paper-acc); }
.paper.dz-moderno .d-cli > div { border-left: 4px solid var(--paper-acc); }
.paper.dz-compacto { font-size: 11.5px; gap: 14px; }
.paper.dz-compacto .d-t td { padding: 4px 5px; }
.paper.dz-compacto .d-cli > div { padding: 8px 10px; }
.paper.cap { width: 716px; max-width: none; padding: 0 2px; margin: 0; box-shadow: none; border-radius: 0; border: 0; }
.paper.cap .tbl-wrap { overflow: visible; }
.paper.cap .d-t { min-width: 0; }
.beta { margin-bottom: 16px; border-color: var(--accent); }
.qs { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.empty { padding: 48px 0; display: grid; gap: 12px; justify-items: start; }

/* Banco */
.bitem { display: grid; gap: 8px; grid-template-columns: 100px 90px 110px 140px minmax(0, 1fr) auto; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 860px) { .bitem { grid-template-columns: 1fr 1fr 1fr; } .bitem .bcat { grid-column: 1 / span 2; } .bitem .bdesc { grid-column: 1 / -1; } .bitem .icon { grid-area: 2 / 3; justify-self: end; align-self: end; } }
.fact { max-width: 900px; margin: 0 auto 16px; }
.packs-sec { margin-bottom: 16px; }
.packs { display: grid; gap: 8px; }
.pack { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.pack summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.pack summary::-webkit-details-marker { display: none; }
.pk-n { font-weight: 600; }
.pk-n::before { content: "+"; display: inline-block; width: 16px; color: var(--muted); font-family: var(--f-num); }
.pack[open] .pk-n::before { content: "−"; }
.pack summary .hint { grid-column: 1; padding-left: 16px; }
.pack summary strong { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.pack[open] summary { border-bottom: 1px solid var(--line); }
.pk-body { padding: 12px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.pk-t { min-width: 520px; }
.med.pk-t td:first-child { width: auto; white-space: nowrap; }
.pk-t input { width: 84px; }
.fallback { width: 100%; min-height: 120px; font-family: var(--f-num); font-size: 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

/* Documento (papel) */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 20px 16px; }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.paper {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08);
  padding: clamp(18px, 5vw, 48px); max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px;
  font-size: 13px; min-width: 0;
}
.paper .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--paper-muted); font-weight: 600; margin-bottom: 4px; }
.d-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; padding-bottom: 18px; border-bottom: 2px solid var(--paper-ink); }
.d-emp { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.d-emp img { max-height: 64px; max-width: 140px; object-fit: contain; }
.d-emp strong { font-size: 17px; display: block; margin-bottom: 2px; }
.d-emp div { color: var(--paper-muted); line-height: 1.5; }
.d-num { text-align: right; }
.d-num .big { font-family: var(--f-num); font-size: 20px; color: var(--paper-ink); }
.d-cli { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.d-cli > div { background: var(--paper-band); padding: 12px 14px; border-radius: 4px; line-height: 1.5; min-width: 0; }
.d-cap h3 { font-size: 14px; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.d-cap h3 span { font-family: var(--f-num); }
.d-t { width: 100%; border-collapse: collapse; min-width: 560px; }

<script>
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const UDS = ["ud", "m", "m²", "m³", "kg", "h", "pa"];

const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });

const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Cálculo ---------- */
function parcial(l) {
  const vs = [l.n, l.l, l.a, l.h].filter((v) => !isNaN(num(v)));
  return vs.length ? vs.reduce((p, v) => p * num(v), 1) : 0;
}
function cantidad(p) { return p.lineas.length ? p.lineas.reduce((s, l) => s + r2(parcial(l)), 0) : n0(p.cant); }

function capTotal(c) { return r2(capBruto(c) * (1 - n0(c.dto) / 100)); }

  const pem = r2(b.caps.reduce((s, c) => s + capTotal(c), 0));
  const gg = r2(pem * n0(b.gg) / 100);
  const bi = r2(pem * n0(b.bi) / 100);
  const sub = r2(pem + gg + bi);
  const dto = r2(sub * n0(b.dto) / 100);
  const base = r2(sub - dto);
  const k = pem ? base / pem : 0, acc = {};
  b.caps.forEach((c) => { const f = 1 - n0(c.dto) / 100; c.partidas.forEach((p) => { if (p.opcional) return; const r = String(p.iva != null && p.iva !== "" ? p.iva : b.iva); acc[r] = (acc[r] || 0) + importe(p) * f * k; }); });
  if (!Object.keys(acc).length) acc[String(b.iva)] = 0;
  const ivaL = Object.keys(acc).sort((x, y) => n0(y) - n0(x)).map((r) => { const bs = r2(acc[r]); return { r, base: bs, v: r2(bs * n0(r) / 100) }; });
  const iva = r2(ivaL.reduce((x, y) => x + y.v, 0));
  return { pem, gg, bi, sub, dto, base, iva, ivaL, total: r2(base + iva) };
}

        P("E13", "Certificado de instalación (CIE) y tramitación", "ud", "180,00", { cant: "1" })

    ],
    gg: "0", bi: "0", dto: "0", iva: "21",
    notas: "Forma de pago: 50 % a la aceptación y 50 % a la finalización de los trabajos.\nNo incluye trabajos no descritos en este presupuesto.\nCualquier trabajo adicional se presupuestará aparte."
  };
  return {
    v: 1,
    empresa: { nombre: "Tu empresa (edita en Mi empresa)", nif: "", dir: "", tel: "", email: "", iban: "", logo: "", iva: "21", validez: "30",

function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  let ok = true; const js = JSON.stringify(S);

let S = load() || seed();
migrate();

const openPacks = new Set();
let tagF = "", recog = null; const openOpts = new Set();

const NOVEDADES = ["Enviar el PDF por WhatsApp o correo, y firma del cliente en pantalla", "Agenda de clientes, aviso de presupuestos sin respuesta y mensaje de seguimiento", "Copias automáticas, papelera de 30 días, buscador y etiquetas", "Partidas opcionales, calendario de pagos, descuentos por partida y por capítulo, IVA por partida", "Fotos, croquis y anotaciones, versiones y opciones básica / recomendada / completa", "Documento en catalán, solo resumen, 3 diseños con tu color y descarga en Excel", "Calculadoras de cable, climatización y tubería, dictado por voz y modo obra", "Textos guardados, numeración a tu gusto y calendario de obras"];

function numPrefix() { const y = String(new Date().getFullYear()); return (S.empresa.numFmt == null ? "P-{AAAA}-" : S.empresa.numFmt).replace(/\{AAAA\}/g, y).replace(/\{AA\}/g, y.slice(2)); }

const dd = (a) => Math.max(0, Math.round((new Date(today() + "T12:00:00") - new Date((a || today()) + "T12:00:00")) / 864e5));

  }).join("");

const AUTOKEY = "puntal-auto";
let lastAuto = 0;
function autoCopias() { try { return JSON.parse(localStorage.getItem(AUTOKEY) || "[]"); } catch (e) { return []; } }
function autoBackup() {
  if (Date.now() - lastAuto < 10 * 60 * 1000) return; lastAuto = Date.now();
  try {
    let arr = autoCopias().filter((x) => x.fecha !== today());
    arr.unshift({ fecha: today(), hora: new Date().toTimeString().slice(0, 5), n: S.presupuestos.length, data: JSON.stringify(S, (k, v) => (k === "fotos" || k === "versiones" ? undefined : v)) });
    arr = arr.slice(0, 5);
    while (arr.length) { try { localStorage.setItem(AUTOKEY, JSON.stringify(arr)); break; } catch (e) { if (arr.length <= 1) break; arr.pop(); } }
  } catch (e) {}
}
function migrate() {

function openSig(who) {
  const b = cur(); if (who === "cliente" && !b) return;
  const m = document.createElement("div"); m.className = "modal"; m.id = "sigm";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Firma"><h2>${who === "empresa" ? "Firma de la empresa" : "Firma del cliente"}</h2>
    <p class="hint">${who === "empresa" ? "Dibuja tu firma con el dedo o el ratón. Saldrá en todos tus presupuestos." : "Pide al cliente que firme con el dedo. El presupuesto quedará como aceptado, con la fecha de hoy."}</p>
    <canvas class="sigpad" id="sigc"></canvas>
    ${who === "cliente" ? `<label class="f"><span>Nombre de quien firma</span><input id="sign" value="${esc(b.cliente.nombre || "")}"></label>` : ""}
    <div class="cap-f"><button class="btn" id="sigclr" type="button">Borrar</button><button class="btn" id="sigx" type="button">Cancelar</button><button class="btn primary" id="sigok" type="button">Guardar firma</button></div></div>`;
  document.body.appendChild(m);
  const c = m.querySelector("#sigc"), ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1, r0 = c.getBoundingClientRect();
  c.width = Math.round(r0.width * dpr); c.height = Math.round(r0.height * dpr); ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; ctx.fillStyle = "#111";
  let drawing = false, has = false, last = null;
  const pt = (e) => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", (e) => { e.preventDefault(); drawing = true; has = true; last = pt(e); try { c.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, 6.3); ctx.fill(); });
  c.addEventListener("pointermove", (e) => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { drawing = false; }; c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  m.querySelector("#sigclr").onclick = () => { ctx.clearRect(0, 0, c.width, c.height); has = false; };
  m.querySelector("#sigx").onclick = () => m.remove();
  m.querySelector("#sigok").onclick = () => {
    if (!has) { toast("Dibuja la firma antes de guardar"); return; }
    const img = c.toDataURL("image/png");
    if (who === "empresa") { S.empresa.firma = img; save(); m.remove(); render(); toast("Firma de la empresa guardada"); return; }
    b.firma = { img, nombre: (m.querySelector("#sign").value || "").trim(), fecha: today() };
    b.estado = "aceptado"; b.aceptadoEl = today(); upsertCliente(b); save(); m.remove(); render(); toast("Firmado: presupuesto aceptado");
  };
}

const H2P = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
function loadScript(src, glob) {
  if (window[glob]) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error("carga")); document.head.appendChild(sc); });
}
const loadH2P = () => loadScript(H2P, "html2pdf");
const XLSXURL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
async function pdfBlob() {
  await loadH2P();
  const el = document.querySelector(".paper"); el.classList.add("cap");
  try {
    const w = window.html2pdf().set({ margin: [10, 10, 12, 10], image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true }, jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: ["tr", ".d-sum", ".d-firmas", ".d-cli", ".d-pagos", "h3", "figure", ".d-op", ".d-foot"] } }).from(el).toPdf();
    const pdf = await w.get("pdf"), cv = await w.get("canvas"), n = pdf.internal.getNumberOfPages();
    try {
      const ph = Math.floor(cv.width * 275 / 190), y0 = (n - 1) * ph;
      if (n > 1 && y0 < cv.height) {
        const d = cv.getContext("2d").getImageData(0, y0, cv.width, Math.min(ph, cv.height - y0)).data; let ink = 0;
        for (let k = 0; k < d.length; k += 16) if (d[k] < 200 || d[k + 1] < 200 || d[k + 2] < 200) ink++;
        if (ink < 40) pdf.deletePage(n);
      } else if (n > 1 && y0 >= cv.height) pdf.deletePage(n);
    } catch (e) {}
    return pdf.output("blob");
  } finally { el.classList.remove("cap"); }
}

function openDraw(src, title, onSave) {
  const m = document.createElement("div"); m.className = "modal"; m.id = "drawm";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${title}" style="width:min(940px,100%)"><h2>${title}</h2>
    <canvas class="drawpad" id="dc"></canvas>
    <div class="cap-f"><button class="btn sel" type="button" data-col="#E5141B">Rojo</button><button class="btn" type="button" data-col="#1F5FBF">Azul</button><button class="btn" type="button" data-col="#111111">Negro</button><button class="btn" id="dundo" type="button">Deshacer</button></div>
    <div class="cap-f"><input id="dtx" placeholder="Texto (por ejemplo: 3,20 m)" style="flex:1;min-width:140px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)"><button class="btn" id="dtxt" type="button">Poner texto</button></div>
    <p class="hint" id="dhint">Dibuja con el dedo o el ratón.</p>
    <div class="cap-f"><button class="btn" id="dx" type="button">Cancelar</button><button class="btn primary" id="dok" type="button">Guardar</button></div></div>`;
  document.body.appendChild(m);
  const c = m.querySelector("#dc"), ctx = c.getContext("2d"), stack = [];
  let col = "#E5141B", drawing = false, last = null, txtMode = false;
  const grid = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.strokeStyle = "#E3E7EC"; ctx.lineWidth = 1; for (let x = 0; x < c.width; x += 50) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, c.height); ctx.stroke(); } for (let y = 0; y < c.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(c.width, y + .5); ctx.stroke(); } };
  if (src) { const im = new Image(); im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); ctx.drawImage(im, 0, 0, c.width, c.height); }; im.src = src; }
  else { c.width = 1200; c.height = 900; grid(); }
  const pt = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  const lw = () => Math.max(3, c.width / 260);
  c.addEventListener("pointerdown", (e) => {
    e.preventDefault(); try { stack.push(ctx.getImageData(0, 0, c.width, c.height)); if (stack.length > 20) stack.shift(); } catch (x) {}
    const p = pt(e);
    if (txtMode) { const tx = m.querySelector("#dtx").value.trim(); if (tx) { ctx.fillStyle = col; ctx.font = `600 ${Math.round(c.width / 28)}px Archivo, Arial, sans-serif`; ctx.fillText(tx, p[0], p[1]); } txtMode = false; m.querySelector("#dhint").textContent = "Dibuja con el dedo o el ratón."; return; }
    drawing = true; last = p; try { c.setPointerCapture(e.pointerId); } catch (x) {}
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p[0], p[1], lw() / 2, 0, 6.3); ctx.fill();
  });
  c.addEventListener("pointermove", (e) => { if (!drawing) return; const p = pt(e); ctx.strokeStyle = col; ctx.lineWidth = lw(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { drawing = false; }; c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  m.querySelectorAll("[data-col]").forEach((bt) => bt.onclick = () => { col = bt.dataset.col; m.querySelectorAll("[data-col]").forEach((x) => x.classList.toggle("sel", x === bt)); });
  m.querySelector("#dundo").onclick = () => { const d = stack.pop(); if (d) ctx.putImageData(d, 0, 0); };
  m.querySelector("#dtxt").onclick = () => { if (!m.querySelector("#dtx").value.trim()) { toast("Escribe primero el texto"); return; } txtMode = true; m.querySelector("#dhint").textContent = "Toca en el dibujo donde quieres poner el texto."; };
  m.querySelector("#dx").onclick = () => m.remove();
  m.querySelector("#dok").onclick = () => { onSave(c.toDataURL("image/jpeg", 0.75)); m.remove(); };
}
function shrink(file, max = 1280, q = 0.7) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); }; im.src = url;
  });
}

function snapB(b) { const { versiones, fotos, firma, ...rest } = b; return JSON.stringify(rest); }

/* ---------- Calculadoras (orientativas) ---------- */
const SECC = [1.5, 2.5, 4, 6, 10, 16, 25, 35, 50, 70, 95, 120, 150, 185, 240];
const APARATOS = [["lav", "Lavabo", 0.10], ["duc", "Ducha", 0.20], ["ban", "Bañera de 1,40 m o más", 0.30], ["bid", "Bidé", 0.10], ["ino", "Inodoro con cisterna", 0.10], ["fre", "Fregadero doméstico", 0.20], ["lvv", "Lavavajillas doméstico", 0.15], ["lvd", "Lavadora doméstica", 0.20]];
const MULTI = [["16 × 2", 12], ["20 × 2", 16], ["26 × 3", 20], ["32 × 3", 26], ["40 × 3,5", 33], ["50 × 4", 42], ["63 × 4,5", 54]];
const COBRE = [["12 × 1", 10], ["15 × 1", 13], ["18 × 1", 16], ["22 × 1", 20], ["28 × 1", 26], ["35 × 1", 33], ["42 × 1,2", 39.6]];
const SPLITS = [2.5, 3.5, 5, 6, 7.1, 10, 12.5, 14];
function cv(k, d) { const v = S.calc[k]; return v == null || v === "" ? d : v; }
function calcRes() {
  const o = {};
  { const tri = cv("c.sis", "m") === "t", V = tri ? 400 : 230, P = num(cv("c.p", "")), Lm = num(cv("c.l", "")), cos = num(cv("c.cos", "1")), du = num(cv("c.du", "3"));
    const g = { "cu70": 48, "cu90": 44, "al70": 30, "al90": 28 }[cv("c.mat", "cu70")];
    if (!(P > 0) || !(Lm > 0) || !(cos > 0) || !(du > 0)) o.cable = `<p class="hint">Escribe la potencia y la longitud.</p>`;
    else {
      const I = tri ? P / (Math.sqrt(3) * V * cos) : P / (V * cos), e = du * V / 100;
      const Smin = tri ? Lm * P / (g * e * V) : 2 * Lm * P / (g * e * V);
      const Sc = SECC.find((x) => x >= Smin);
      const cdt = Sc ? (tri ? Lm * P / (g * Sc * V) : 2 * Lm * P / (g * Sc * V)) / V * 100 : null;
      o.cable = `<div class="res"><span>Intensidad de cálculo</span><b>${qf.format(r2(I))} A</b><span>Sección mínima por caída de tensión: ${qf.format(r2(Smin))} mm²</span>
        <span>Sección comercial: <b>${Sc ? String(Sc).replace(".", ",") + " mm²" : "más de 240 mm²: divide en varios conductores"}</b>${cdt != null ? ` · caída real ${qf.format(r2(cdt))} %` : ""}</span></div>`;
    } }
  { const m2 = num(cv("k.m2", "")), r = num(cv("k.r", "100"));
    if (!(m2 > 0)) o.clima = `<p class="hint">Escribe la superficie.</p>`;
    else { const kw = m2 * r / 1000, sp = SPLITS.find((x) => x >= kw);
      o.clima = `<div class="res"><span>Potencia frigorífica estimada</span><b>${qf.format(r2(kw))} kW</b><span>≈ ${Math.round(kw * 860).toLocaleString("es-ES")} frigorías/hora</span><span>Equipo comercial orientativo: <b>${sp ? String(sp).replace(".", ",") + " kW" : "más de 14 kW: varios equipos o sistema por conductos"}</b></span></div>`; } }
  { let Q = 0, n = 0; APARATOS.forEach(([k, , q]) => { const c = Math.max(0, Math.floor(num(cv("t." + k, "0")) || 0)); Q += c * q; n += c; });
    const v = num(cv("t.v", "1,5"));
    if (!n || !(v > 0)) o.tubo = `<p class="hint">Indica cuántos aparatos alimenta el tramo.</p>`;
    else { const K = n > 1 ? 1 / Math.sqrt(n - 1) : 1, Qs = Q * K, D = Math.sqrt(4 * (Qs / 1000) / (Math.PI * v)) * 1000;
      const mu = MULTI.find((x) => x[1] >= D), co = COBRE.find((x) => x[1] >= D);
      o.tubo = `<div class="res"><span>Caudal instalado ${qf.format(r2(Q))} l/s · simultaneidad ${qf.format(r2(K))}</span><b>${qf.format(r2(Qs))} l/s</b><span>Diámetro interior mínimo: ${qf.format(r2(D))} mm</span>
        <span>Multicapa: <b>${mu ? mu[0] + " mm" : "más de 63 mm"}</b> · Cobre: <b>${co ? co[0] + " mm" : "más de 42 mm"}</b></span></div>`; } }
  return o;
}

function parseCSV(text) {

    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }

    save(); updateOutputs(); return;
  }
  if (d.cl != null) { const [i, f] = d.cl.split("."); if (S.clientes[i]) { S.clientes[i][f] = t.value; save(); } return; }

  if (d.e != null) { S.empresa[d.e] = t.value; save(); const nn = $("#nextnum"); if (nn) nn.textContent = nextNum(); return; }
  if (d.tx != null) { const [i, f] = d.tx.split("."); if (S.textos[i]) { S.textos[i][f] = t.value; save(); } return; }
  if (d.calc != null) { S.calc[d.calc] = t.value; save(); renderCalc(); return; }
  if (d.bk != null) { const [i, f] = d.bk.split("."); if (S.banco[i]) { S.banco[i][f] = t.value; save(); } return; }
  if (d.pk != null) { const [i, f] = d.pk.split("."); const pk = S.packs[i]; if (pk) { pk[f] = t.value; save(); const n = document.getElementById("pkn-" + pk.id); if (n) n.textContent = t.value; } return; }
  if (d.pki != null) {
    const [i, ii] = d.pki.split(".").map(Number), pk = S.packs[i];
    if (pk && pk.items[ii]) {
      pk.items[ii].cant = t.value; save();
      const r = document.getElementById(`pkr-${pk.id}-${ii}`); if (r) r.textContent = eur.format(r2(n0(t.value) * n0(packItem(pk.items[ii]).precio)));
      const tt = document.getElementById("pkt-" + pk.id); if (tt) tt.textContent = eur.format(packTotal(pk));
    }
    return;
  }
  if (t.id === "bsearch") { bq = t.value; renderBancoList(); return; }
  if (t.id === "psearch") { pq = t.value; renderPickList(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "docmed") { S.docMed = t.checked; save(); render(); return; }
  if (t.dataset.opc) { const [ci, pi] = t.dataset.opc.split(".").map(Number); const p = cur().caps[ci].partidas[pi]; p.opcional = t.checked; save(); render(); return; }
  if (t.id === "adj-cat") { adjCat = t.value; return; }
  if (t.id === "docmodo") { S.docModo = t.value; save(); render(); return; }
  if (t.id === "doclang") { S.docLang = t.value; save(); render(); return; }
  if (t.id === "modoobra") { S.modoObra = t.checked; save(); render(); return; }
  if (t.id === "docfotos") { cur().docFotos = t.checked; save(); return; }
  if (t.id === "tx-pick") { const x = S.textos.find((y) => y.id === t.value), b = cur(); if (x && b) { b.notas = (b.notas ? b.notas.replace(/\s*$/, "\n") : "") + x.texto; save(); render(); toast(`Insertado: ${x.nombre}`); } return; }
  if (t.dataset.b && t.tagName === "SELECT") { render(); return; }
  if (t.id === "foto-in" && t.files.length) {
    const b = cur(), files = [...t.files]; toast("Añadiendo fotos…");
    (async () => { let n = 0; for (const f of files) { try { b.fotos.push({ id: uid(), img: await shrink(f), pie: "" }); n++; } catch (e) {} } save(); render(); toast(n ? `${n} foto${n === 1 ? "" : "s"} añadida${n === 1 ? "" : "s"}` : "No se pudo leer la imagen"); if (usoPct() > 80) setTimeout(() => toast("Te queda poco espacio en el dispositivo: descarga una copia"), 2500); })();
    t.value = ""; return;
  }
  if (t.id === "cli-pick") {
    const b = cur(), c = S.clientes.find((x) => x.id === t.value); if (!b || !c) return;
    b.cliente = { nombre: c.nombre || "", nif: c.nif || "", dir: c.dir || "", tel: c.tel || "", email: c.email || "" }; b.clienteId = c.id; save(); render(); return;
  }
  if (t.id === "logo-in" && t.files[0]) {
    const f = t.files[0];
    if (f.size > 400 * 1024) { toast("El logotipo pesa más de 400 KB. Usa una imagen más pequeña."); return; }
    const r = new FileReader(); r.onload = () => { S.empresa.logo = r.result; save(); render(); toast("Logotipo actualizado"); }; r.readAsDataURL(f);
    return;
  }
  if (t.id === "bimp-in" && t.files[0]) {
    const file = t.files[0], r = new FileReader();
    r.onload = () => {
      try {
        const txt = String(r.result);
        if (isPackCSV(txt)) {
          const { packs, items } = importPacks(txt); save(); render();
          toast(`Importadas ${packs} plantillas con ${items} partidas`);
        } else {
          const { add, upd, kept } = importBanco(txt);
          S.bancoInfo = `${file.name} (${fdate(today())})`; save(); render();
          toast(`Paquete importado: ${add} partidas nuevas, ${upd} actualizadas${kept ? `; se mantiene tu precio en ${kept}` : ""}`);
        }
      } catch (err) { toast("No se pudo leer el CSV. Para precios: columnas Descripción y Precio. Para plantillas: columnas Plantilla, Código y Cantidad."); }
      t.value = "";
    };
    r.readAsText(file, "utf-8");
    return;
  }
  if (t.id === "imp-in" && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.presupuestos) || !d.empresa || !Array.isArray(d.banco)) throw new Error("formato");
        S = d; migrate(); save(); render(); toast(`Copia restaurada: ${d.presupuestos.length} presupuestos`);
      } catch (err) { toast("Ese archivo no es una copia de Puntal. Elige el archivo .json que descargaste."); }
    };
    r.readAsText(t.files[0]);
  }
});

document.addEventListener("toggle", (e) => {
  const el = e.target;
  if (el.classList && el.classList.contains("popt") && el.dataset.pid) { if (el.open) openOpts.add(el.dataset.pid); else openOpts.delete(el.dataset.pid); return; }
  if (el.classList && el.classList.contains("pack")) { if (el.open) openPacks.add(el.dataset.pid); else openPacks.delete(el.dataset.pid); }
}, true);

render();

/* App instalable: solo cuando se sirve desde la web (no como archivo ni dentro de un visor) */
if (!IN_FRAME && location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => { document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); }); }).catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  });
  if (navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (document.getElementById("updbar")) return;
    const d = document.createElement("div"); d.className = "upd"; d.id = "updbar"; d.innerHTML = `<span>Hay una versión nueva de Puntal</span><button class="btn primary" type="button">Actualizar</button>`;
    d.querySelector("button").onclick = () => location.reload(); document.body.appendChild(d);
  });
}
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; const b = $("#install"); if (b) b.hidden = false; });
window.addEventListener("appinstalled", () => { const b = $("#install"); if (b) b.hidden = true; toast("Puntal instalada"); });
document.addEventListener("click", (e) => {
  if (e.target.id !== "install" || !installEvt) return;
  installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; e.target.hidden = true; });
});
</script>
